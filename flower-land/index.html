<style>
/* Layout: 위 막대(날짜·계절 시계·돈) + 탭 8개(정원·화원·제다실·찻집·창고·도감기록·매뉴얼·설정). PC는 왼쪽 탭과 오른쪽 상태창, 휴대폰은 아래 탭과 아래에서 올라오는 상태창 */
:root {
  --bg: #eef0e8; --panel0: #f8f9f4; --sunk0: #e4e8de; --ink: #1f2a22; --muted: #5a675c; --line0: #d2d9cc;
  --accent: #5b8a6e; --accent-ink: #f6fbf7; --good: #3f7f4a; --warn: #a8652a;
  --spring: #e39ab3; --summer: #64a653; --autumn: #cc8636; --winter: #86abc3; --rest: #a993c9; --seed: #8a6a44;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131814; --panel0: #1b221d; --sunk0: #232c25; --ink: #e4eae1; --muted: #98a59a; --line0: #2e3831; --accent: #8fc4a3; --accent-ink: #10241a; --good: #79c287; --warn: #e0a066; --seed: #c49a6a; color-scheme: dark;
} }
:root[data-theme="dark"] { --bg: #131814; --panel0: #1b221d; --sunk0: #232c25; --ink: #e4eae1; --muted: #98a59a; --line0: #2e3831; --accent: #8fc4a3; --accent-ink: #10241a; --good: #79c287; --warn: #e0a066; --seed: #c49a6a; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
/* 계절 바탕: 카드·지도는 그대로, 뒤 바탕만 계절 색을 아주 옅게 섞음 */
:root { --season-c: var(--bg); --season-amt: 15%; }
/* 카드·막대·선도 같은 계절 색을 아주 조금씩 머금게 (배경과 어울리게) */
:root { --panel: color-mix(in srgb, var(--season-c) 7%, var(--panel0)); --sunk: color-mix(in srgb, var(--season-c) 14%, var(--sunk0)); --line: color-mix(in srgb, var(--season-c) 22%, var(--line0)); }
:root[data-season="0"] { --season-c: var(--spring); }
:root[data-season="1"] { --season-c: var(--summer); }
:root[data-season="2"] { --season-c: var(--autumn); }
:root[data-season="3"] { --season-c: var(--winter); }
:root[data-season="4"] { --season-c: var(--rest); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --season-amt: 9%; } }
:root[data-theme="dark"] { --season-amt: 9%; }
:root.season-anim body { transition: background-color 3s ease; }   /* 처음 열 때는 바로, 계절이 바뀔 때만 천천히 */
body { background: var(--bg); background-color: color-mix(in srgb, var(--season-c) var(--season-amt), var(--bg)); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--font-display); font-size: 20px; margin: 0; font-weight: 700; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: 16px; margin: 0; font-weight: 700; }
.stars { color: #d39b12; letter-spacing: -1px; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.22); display: inline-block; }

/* ── 전체 틀 */
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); padding: 9px 16px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.topinfo { justify-self: end; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.35; display: flex; align-items: center; gap: 10px; }
.toptitle { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--sunk); padding: 1px 8px 1px 2px; font-size: 12px; color: var(--ink); }   /* P19-05-05 대표 칭호 */
.toptitle[hidden] { display: none; }
@media (max-width: 640px) { .topbar { grid-template-columns: 1fr; gap: 3px; padding-block: 8px; } .brand { justify-self: start; } .topinfo { justify-self: start; text-align: left; font-size: 11.5px; } }
.wallet { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px; font-family: var(--font-data); font-weight: 600; font-size: 14px; white-space: nowrap; }
/* 로고: 도트 새싹 + 둥근 글씨 */
.brand { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; border: 0; background: none; padding: 2px 4px 2px 0; margin: -2px 0; color: inherit; text-align: left; cursor: pointer; justify-self: start; }   /* 왼쪽에 작게 (10-05) · 누르면 정원으로 (10-17) */
.brand:hover .bt b { color: var(--accent); }
.brand .logo-px { flex: none; image-rendering: pixelated; }
.brand .bt { display: grid; line-height: 1.05; }
.brand .bt b { font-family: "Jua", var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .02em; color: var(--ink); }
.brand .bt small { font-family: var(--font-data); font-size: 8.5px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
@media (max-width: 420px) { .brand .bt b { font-size: 17px; } }
.money { font-family: var(--font-data); font-weight: 500; white-space: nowrap; }
.iconbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 17px; flex: none; }
.iconbtn:hover { border-color: var(--muted); }

.body { display: grid; grid-template-columns: 1fr; min-height: 0; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(8, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 1px; font-size: 12px; color: var(--muted); }
nav.tabs button .ic { font-size: 19px; line-height: 1.1; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
@media (min-width: 900px) {
  .app { grid-template-rows: auto 1fr; }
  .body { grid-template-columns: 96px minmax(0, 1fr); }
  main { padding-bottom: 24px; }
  nav.tabs { position: sticky; top: 61px; bottom: auto; left: auto; right: auto; align-self: start; grid-template-columns: 1fr; border-top: 0; border-right: 1px solid var(--line); background: transparent; padding: 10px 6px; gap: 4px; order: -1; }
  nav.tabs button { padding: 10px 4px; border-radius: 10px; }
  nav.tabs button[aria-selected="true"] { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
}
main { min-width: 0; padding-block: 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); padding-inline: 16px; }
.panel { display: none; }
.panel.on { display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.good { color: var(--good); }
.chip.accent { color: var(--accent); }
.empty { color: var(--muted); padding: 10px 0; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* ── 정원 */
.garden { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 1180px) { .garden { grid-template-columns: minmax(0, 1fr) 320px; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tool { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 11px; white-space: nowrap; }
.tool:hover:not(:disabled) { border-color: var(--muted); }
.tool[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tool:disabled { opacity: .45; cursor: default; }
.tool .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.plantsel { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 10px; max-width: 100%; }
.subbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 3px 10px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--sunk); color: var(--ink); font-weight: 600; }
.care-ring { position: absolute; inset: 0; pointer-events: none; z-index: 4; }   /* 꽃 둘레 돌보기 단추 (10-06) */
.ring-btn { pointer-events: auto; position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 2px solid var(--k); background: var(--panel); display: grid; place-items: center; font-size: 17px; padding: 0; cursor: pointer; box-shadow: 0 3px 10px rgba(40,30,20,.22); animation: ringPop .22s ease both; animation-delay: var(--d); }
.ring-btn.lack { border-style: dashed; filter: grayscale(.85); opacity: .75; }   /* ⑯ 도구가 없는 돌보기 (10-06) */
.ring-btn .ring-lack { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); font-size: 12px; line-height: 14px; font-style: normal; color: var(--muted); }
.ring-btn:hover { background: color-mix(in srgb, var(--k) 14%, var(--panel)); transform: scale(1.08); }
@keyframes ringPop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ring-btn { animation: none; } }
.mapframe { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #a39b8e; box-shadow: 0 6px 18px rgba(40, 30, 20, .10); }
canvas#map { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.feedback { min-height: 22px; font-size: 13px; color: var(--muted); }
.feedback.warn { color: var(--warn); }
.topfb { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px 7px 14px; margin-bottom: 12px; color: var(--ink); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topfb[hidden] { display: none; }
.topfb.warn { color: var(--warn); }
.topfb button, .snack button { border: 0; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 600; }
.topfb button { background: var(--accent); color: var(--accent-ink); }

/* 오늘의 정원, 첫걸음 */
.today { display: grid; gap: 8px; }
.today:empty { display: none; }
.todo { display: flex; flex-wrap: wrap; gap: 8px; }
.todo .item { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 10px; font-size: 13.5px; }
.todo .item .ic { font-size: 17px; }
.todo .calm { color: var(--muted); font-size: 13.5px; padding: 4px 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.guide { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 9px 34px 9px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.guide .gd-t { font-family: var(--font-display); font-weight: 700; font-size: 14px; white-space: nowrap; }
.guide .gd-t .data { font-size: 12px; color: var(--muted); margin-left: 2px; }
.guide .gd-steps { display: inline-flex; gap: 4px; }
.guide .gd-steps i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; background: var(--sunk); opacity: .55; }
.guide .gd-steps i.done { opacity: .9; background: color-mix(in srgb, var(--accent) 16%, var(--panel)); }
.guide .gd-steps i.now { opacity: 1; background: var(--panel); box-shadow: 0 0 0 2px var(--accent); }
.guide .gd-now { flex: 1; min-width: 180px; display: grid; font-size: 13px; line-height: 1.35; }
.guide .gd-now small { font-size: 11.5px; color: var(--muted); }
.guide .x { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: var(--muted); font-size: 14px; padding: 4px 6px; }

/* 도구 묶음 */
.dock { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.dock .grp { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--sunk); flex-wrap: wrap; }
.dock .tool { position: relative; border: 0; background: transparent; flex-direction: column; gap: 1px; padding: 5px 9px; border-radius: 9px; font-size: 12px; min-width: 56px; color: var(--muted); }
.dock .tool .ic { font-size: 18px; line-height: 1.2; }
.dock .tool:hover:not(:disabled) { background: color-mix(in srgb, var(--panel) 60%, transparent); color: var(--ink); }
.dock .tool[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12), inset 0 0 0 1.5px var(--accent); }
.dock .tool .badge { position: absolute; top: 2px; right: 4px; font-family: var(--font-data); font-size: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 5px; line-height: 15px; }
.tray { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tray[hidden] { display: none; }
.seedchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; }
.seedchip.none { color: var(--muted); }   /* 심기 모드 처음엔 "선택 안 함" (10-06) */
.seedchip.none[aria-pressed="true"] { color: var(--ink); }
#tray.nudge .seedchip:not(.none) { animation: nudge .5s ease 2; }   /* 고르지 않고 빈 칸을 누르면 꽃 칩이 살짝 흔들림 */
@keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateY(-3px); } 60% { transform: translateY(1px); } }
@media (prefers-reduced-motion: reduce) { #tray.nudge .seedchip:not(.none) { animation: none; outline: 2px solid var(--accent); } }
.seedchip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.hintbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 14px; font-size: 13px; }   /* 상자 없이: 숫자와 날짜만 지도 위 오른쪽에 */
.hintbar .msg { flex: 1 1 260px; min-width: 0; font-weight: 600; }
.hintbar .msg[hidden] { display: none; }
.hintbar .opts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); }
.needs { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.needs .nd { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 1px 8px 1px 6px; font-size: 13px; color: var(--ink); }
.needs .nd.on:hover { box-shadow: inset 0 0 0 1px var(--k); }
.needs .nd b { font-family: var(--font-data); font-size: 12px; font-weight: 600; }
.needs .nd.on { border-color: var(--k); background: color-mix(in srgb, var(--k) 14%, var(--panel)); }
.needs .nd.on b { color: var(--k); }
.btn.care { background: var(--k); border-color: var(--k); color: #fff; font-weight: 600; }
.btn.care:hover { filter: brightness(1.08); }
.needs .nd:not(.on) { opacity: .45; }

/* 지도 위 */
.snack { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(28,36,30,.94); color: #f2f5ef; border-radius: 999px; padding: 7px 8px 7px 14px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.snack[hidden] { display: none; }
.snack.warn { background: rgba(122,64,24,.95); }
.snack button { background: rgba(255,255,255,.18); color: inherit; }
.emptyhint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 16px; }
.emptyhint[hidden] { display: none; }
.emptyhint .box { pointer-events: auto; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; text-align: center; display: grid; gap: 8px; max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.emptyhint .box b { font-family: var(--font-display); font-size: 16px; }
.tip { position: fixed; z-index: 45; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.15); max-width: 250px; line-height: 1.45; }
.tip[hidden] { display: none; }
.legend2 { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); align-items: center; }
.legend2 span { display: inline-flex; align-items: center; gap: 4px; }
.legend2 .lg-t { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink); margin-right: 2px; }
.legend2 .lg-chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 9px 2px 6px; color: var(--ink); }
.legend2 .lg-chip.barren { color: var(--muted); background: transparent; }
.legend2 .lg-chip .data { color: var(--muted); }
/* 땅 범례는 지도 위 왼쪽 위에 반투명하게 (10-06): 지도 아래 줄을 없애 화면이 짧아짐 */
.legend2.on-map { position: absolute; top: 14px; left: 10px; right: 10px; z-index: 2; pointer-events: none; gap: 4px; }
.legend2.on-map .lg-chip { background: color-mix(in srgb, var(--panel) 78%, transparent); backdrop-filter: blur(3px); border-color: transparent; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-size: 11.5px; padding: 1px 8px 1px 5px; }
.legend2.on-map .lg-chip.barren { background: color-mix(in srgb, var(--panel) 55%, transparent); }
/* 돌볼 꽃 칩 앞 한마디 */
.needs { align-items: center; }
.needs .nd-say { font-size: 12px; color: var(--muted); margin-right: 4px; }
.seasonchip { font-size: 11px; padding: 1px 7px; border-radius: 999px; color: #fff; margin-right: 6px; vertical-align: 1px; font-weight: 600; }
.filter { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.filter input { accent-color: var(--accent); width: 16px; height: 16px; }
#restBanner .box { position: relative; padding-top: 18px; }
.restclose { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; font-size: 13px; }

/* 상태창 (P14) */
.status { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.sidecol { display: grid; gap: 14px; align-content: start; min-width: 0; }
@media (min-width: 1180px) { .sidecol { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 76px); overflow-y: auto; scrollbar-width: thin; } }   /* 넓은 화면: 지도를 내려도 상태창이 보임 */
/* 정원 일지: 상태창과 같은 카드 머리 */
.gardenlog summary { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; }
.gardenlog summary::-webkit-details-marker { display: none; }
.gardenlog .gl-ic { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: var(--sunk); }
.gardenlog .gl-t { display: grid; line-height: 1.3; min-width: 0; }
.gardenlog .gl-t b { font-family: var(--font-display); font-size: 16px; }
.gardenlog .gl-t small { font-size: 12px; color: var(--muted); }
.gardenlog .gl-n { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); background: var(--sunk); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.gardenlog .gl-chev { color: var(--muted); font-size: 12px; transition: transform .15s; }
.gardenlog[open] .gl-chev { transform: rotate(180deg); }
.gardenlog .logview { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); max-height: 320px; overflow-y: auto; padding-right: 4px; }
/* 상태창 카드형 */
.sx-land { display: block; width: 56px; height: 56px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); background-image: linear-gradient(45deg, rgba(255,255,255,.1) 25%, transparent 25% 50%, rgba(255,255,255,.1) 50% 75%, transparent 75%); background-size: 14px 14px; }
.sx-sec { font-family: var(--font-display); font-weight: 700; font-size: 15px; border-top: 1px solid var(--line); padding-top: 10px; }
.sx-tips { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.sx-tips > div { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; line-height: 1.4; }
.sx-tips .ti { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-size: 16px; }
.sx-tips .muted { font-size: 12px; }
/* 빈 칸: 심을 꽃 카드 (누르면 심기) */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.pcard { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 7px 7px 8px; display: grid; gap: 3px; justify-items: start; text-align: left; font-size: 12px; color: var(--ink); min-width: 0; }
.pcard:hover { border-color: var(--accent); }
.pcard.fits { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pcard .pc-art { position: relative; width: 100%; height: 58px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--pc) 16%, var(--sunk)); margin-bottom: 2px; }
.pcard .pc-count { position: absolute; right: 6px; bottom: 4px; font-family: var(--font-data); font-weight: 600; font-size: 12px; background: var(--panel); border-radius: 999px; padding: 0 6px; }
.pcard .pc-name b { font-size: 14px; font-family: var(--font-display); }
.pcard .stars { font-size: 11px; }
.pcard .pc-land { color: var(--muted); }
.pcard .pc-land .sw { width: 9px; height: 9px; margin-right: 4px; vertical-align: -1px; }
.pcard .pc-fit { color: var(--accent); font-weight: 600; }
.pcard .pc-go { justify-self: stretch; text-align: center; margin-top: 4px; padding: 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 12.5px; }
.sx-head { display: flex; align-items: center; gap: 12px; position: relative; padding-right: 30px; }
.sx-art { flex: none; background: var(--sunk); border-radius: 14px; padding: 6px; }
.sx-title { display: grid; gap: 2px; min-width: 0; }
.sx-title h3 { font-size: 20px; }
.sx-quote { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 700; line-height: 1.45; text-wrap: balance; color: var(--ink); }
.sx-lang { font-size: 12.5px; color: var(--muted); margin: 2px 0 1px; }   /* 이달의 꽃 · 꽃말 (10-06) */
.sx-lang b { color: var(--ink); font-weight: 600; }
.sx-quote::before { content: "“"; color: var(--accent); margin-right: 2px; }
.sx-quote::after { content: "”"; color: var(--accent); margin-left: 2px; }
.sx-close { position: absolute; top: -4px; right: -4px; width: 30px; height: 30px; font-size: 13px; background: transparent; border-color: transparent; color: var(--muted); }
.sx-close:hover { border-color: var(--line); }
.sx-stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.sx-stats > div { display: grid; justify-items: center; gap: 1px; padding: 8px 4px; text-align: center; min-width: 0; }
.sx-stats > div + div { border-left: 1px solid var(--line); }
.sx-stats .lbl { font-size: 11px; color: var(--muted); }
.sx-stats b { font-family: var(--font-data); font-size: 18px; font-weight: 600; line-height: 1.2; }
.sx-stats .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sx-note { font-size: 12px; color: var(--ink); line-height: 1.45; padding: 7px 10px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
/* 자라는 단계 길 */
.stagepath { display: flex; gap: 3px; font-size: 11px; }
.stagepath span { flex: 1; text-align: center; padding: 3px 2px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stagepath span.past { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); color: var(--ink); }
.stagepath span.cur { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.stagepath span.odd { flex: 1.3; }
/* 수치 칸 작은 막대 */
.sx-stats .mini { width: 70%; height: 4px; border-radius: 999px; background: var(--sunk); overflow: hidden; margin: 2px 0 1px; }
.sx-stats .mini i { display: block; height: 100%; border-radius: inherit; }
.sx-stats .mini.land i { width: 100%; }
.sx-care { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ct { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--ink); min-width: 0; }
.ct .ci { position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; border: 2px solid color-mix(in srgb, var(--k) 40%, transparent); background: color-mix(in srgb, var(--k) 8%, var(--panel)); transition: transform .12s; }
.ct .ci i { position: absolute; right: -3px; bottom: -3px; width: 17px; height: 17px; border-radius: 50%; background: var(--k); color: #fff; font-size: 10px; font-style: normal; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--panel); }
.ct .cl { font-size: 12px; font-weight: 600; }
.ct .cs { font-size: 10.5px; color: var(--muted); line-height: 1.2; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ct.need .ci { background: var(--k); border-color: var(--k); box-shadow: 0 3px 8px color-mix(in srgb, var(--k) 35%, transparent); }
.ct.need .cs { color: var(--k); font-weight: 600; }
.ct.need:hover .ci { transform: translateY(-2px); }
.ct.done .ci { background: color-mix(in srgb, var(--k) 16%, var(--panel)); }
.ct.lack .ci { border-style: dashed; }
.ct.lack .cs { color: var(--warn); }
.ct.na { opacity: .45; }
.ct:disabled { cursor: default; }
.sx-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sx-act { display: grid; gap: 3px; align-content: start; }
.sx-act .btn { width: 100%; justify-content: center; }
.sx-act .muted { font-size: 11px; text-align: center; line-height: 1.3; }
.status .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.status .head h3 { font-size: 18px; }
.meter { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.bar { height: 7px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.carelist { display: grid; gap: 4px; font-size: 13px; }
.carelist div { display: grid; grid-template-columns: 22px 64px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 26px; }
.carelist .btn.small { padding: 2px 10px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
/* 픽셀 설명 (10-17): 글 대신 도트 칸으로 — 모서리 없는 네모 칸, 2px 틈 */
.mstrip { display: grid; grid-template-columns: auto repeat(14, minmax(0, 1fr)); gap: 2px; align-items: center; margin: 6px 0 8px; font-family: var(--font-data); }
.mstrip i { display: block; height: 11px; background: var(--sunk); font-style: normal; }
.mstrip i.on { background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.mstrip i.ms-h { height: auto; padding: 1px 0; font-size: 9.5px; line-height: 1.2; text-align: center; color: var(--ink); background: color-mix(in srgb, var(--c) 45%, var(--panel)); }
.mstrip i.now { outline: 2px solid var(--ink); outline-offset: -1px; position: relative; z-index: 1; }
.mstrip .ms-l { display: flex; align-items: center; gap: 3px; padding-right: 4px; font-size: 11px; white-space: nowrap; }
.mstrip .ms-l small { font-family: var(--font-body); color: var(--muted); font-size: 11px; }
.gauges { display: grid; gap: 4px; margin: 6px 0 8px; }
.gauge { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
.gauge .g-l { color: var(--muted); white-space: nowrap; }
.gauge .g-bar { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px; padding-bottom: 7px; }
.gauge .g-bar i { height: 10px; background: var(--sunk); position: relative; }
.gauge .g-bar i.band { background: var(--c); }
.gauge .g-bar i.here::after { content: ""; position: absolute; left: 50%; top: 11px; transform: translateX(-50%); border: 4px solid transparent; border-top: 0; border-bottom: 5px solid var(--ink); }
.gauge .g-v { font-size: 11.5px; white-space: nowrap; text-align: right; min-width: 5.5em; }
.ob-vis { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; align-items: center; }
.ob-vis figure { display: contents; margin: 0; }
.ob-vis figcaption { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.ob-vis figcaption b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 1px; }
.landpx { display: grid; grid-template-columns: repeat(7, 16px); grid-auto-rows: 16px; gap: 1px; justify-self: center; }
.landpx i { display: grid; place-items: center; overflow: visible; }
.landpx i img { position: relative; z-index: 1; }
.wkpx { display: grid; grid-template-columns: auto repeat(7, 22px); gap: 2px; font-family: var(--font-data); justify-self: center; }
.wkpx b { font-family: var(--font-body); font-size: 11px; font-weight: 500; text-align: center; color: var(--muted); }
.wkpx b.rest { color: var(--rest); }
.wkpx .wk-l { font-size: 11px; padding-right: 2px; align-self: center; }
.wkpx i { height: 20px; display: grid; place-items: center; font-style: normal; font-size: 10px; color: #1f2a22; background: var(--c); }
.wkpx i.now { outline: 2px solid var(--ink); outline-offset: -1px; }
.ob-care { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.ob-care span { display: inline-grid; place-items: center; width: 24px; height: 24px; background: var(--sunk); }
.beq { display: flex; align-items: flex-end; justify-content: center; gap: 10px; flex-wrap: wrap; }
.beq-i { display: grid; justify-items: center; gap: 4px; position: relative; }
.beq-i small { font-size: 11.5px; color: var(--muted); }
.beq-i.out small { color: var(--ink); font-weight: 600; }
.beq-op { font-family: var(--font-data); font-size: 20px; font-weight: 500; color: var(--muted); align-self: center; padding-bottom: 18px; }
.beq-x { position: absolute; top: -6px; right: -14px; font-style: normal; font-family: var(--font-data); font-size: 11px; font-weight: 600; padding: 1px 5px; background: var(--good); color: var(--accent-ink); }
@media (max-width: 420px) { .ob-vis { grid-template-columns: 1fr; justify-items: center; } .ob-vis figcaption { text-align: center; } }
/* 도감일지 · 퀘스트 · 칭호 (P19, 10-17): 네모 칸 · 도트 그림 규칙(P16-14)을 따름 */
.j-head { margin-top: 4px; }   /* 도감일지: 🏅 칭호 → 📜 퀘스트 한 페이지 (10-17) */
.jch { display: grid; gap: 10px; }
.jch.closed { opacity: .72; }
.jch-head { display: flex; align-items: center; gap: 12px; }
.jch-t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.jch-t small { color: var(--muted); font-size: 11.5px; font-family: var(--font-data); }
.jch-t b { font-family: var(--font-display); font-size: 16px; }
.jch-stamps { display: flex; gap: 3px; }
.jch-stamps i { width: 10px; height: 10px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.jch-stamps i.on { background: #c8323c; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), inset 3px 3px 0 -1px rgba(255,255,255,.25); }
.jch-n { font-size: 13px; color: var(--muted); }
.jch.cleared .jch-n { color: var(--good); font-weight: 600; }
.q-list { display: grid; gap: 4px; }
.q-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--panel); padding: 4px 10px 4px 4px; }
.q-row .q-art { width: 36px; height: 36px; display: grid; place-items: center; background: var(--sunk); }
.q-row .q-land { width: 24px; height: 24px; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.q-row .q-name { font-size: 13.5px; }
.q-row .q-st { font-size: 12px; white-space: nowrap; color: var(--muted); }
.q-row.now { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.q-row.now .q-st { color: var(--good); font-weight: 600; }
.q-row.later { opacity: .62; }
.q-row.done .q-name { color: var(--muted); }
.q-row.done .q-st { color: #c8323c; font-family: var(--font-data); }
.jch-reward { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.ttl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ttl-card { display: grid; justify-items: center; gap: 5px; text-align: center; padding: 12px 8px; background: var(--panel); border: 1px solid var(--line); }
.ttl-card b { font-family: var(--font-display); font-size: 14.5px; }
.ttl-card small { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.ttl-card.locked b { color: var(--muted); }
.ttl-card.on { border: 2px solid var(--accent); padding: 11px 7px; }
.ttl-tier { font-size: 11px; padding: 1px 7px; background: var(--sunk); color: var(--muted); }
.t-s .ttl-tier { background: color-mix(in srgb, #8a6a44 22%, var(--panel)); color: var(--ink); }
.t-f .ttl-tier { background: color-mix(in srgb, #e39ab3 26%, var(--panel)); color: var(--ink); }
.t-g .ttl-tier { background: color-mix(in srgb, #e2b33c 30%, var(--panel)); color: var(--ink); }
.ttl-pop { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 6px 0 2px; }
.ttl-pop b { font-family: var(--font-display); font-size: 19px; }
.ttl-pop small { color: var(--muted); font-size: 12.5px; }
.ttl-anim { width: 132px; height: 132px; image-rendering: pixelated; }
.jguide .btn.small { white-space: nowrap; }
/* 불러오기 확인 창 (P20-03): 지금 정원 ↔ 불러올 정원 */
.imp-cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: stretch; }
.imp-col { display: grid; justify-items: center; gap: 6px; padding: 10px; background: var(--sunk); text-align: center; }
.imp-col .kv { width: 100%; font-size: 12.5px; }
.imp-col .imp-l { color: var(--muted); font-size: 12px; }
.imp-col > b { font-family: var(--font-display); font-size: 15px; }
.imp-ph { width: 44px; height: 44px; display: grid; place-items: center; background: var(--panel); font-size: 20px; }
.imp-arrow { align-self: center; font-size: 22px; color: var(--muted); }
.imp-opt { display: flex; align-items: center; gap: 6px; font-size: 13px; }
/* 접기 상자 (10-17): 못 모은 도감 칸 · 닫힌 장 · 못 얻은 칭호 */
.fold { margin-top: 8px; }
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; color: var(--muted); border: 1px dashed var(--line); background: var(--panel); }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
.fold[open] > summary::before { transform: rotate(90deg); }
.fold[open] > summary { margin-bottom: 8px; }
.fold > summary:hover { color: var(--ink); border-color: var(--muted); }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.actions { display: grid; gap: 6px; padding-top: 2px; }
.actions .act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
.plantlist { display: grid; gap: 6px; }
.plantrow { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; }
.plantrow:hover { border-color: var(--accent); }
.plantrow .pr-main { flex: 1; min-width: 0; line-height: 1.35; }
.plantrow .pr-go { font-size: 13px; font-weight: 600; color: var(--accent); }
.sheetclose { display: none; }
/* 좁은 화면: 상태창은 지도 바로 아래에 늘 보임 (메뉴는 맨 아래) */

/* ── 화원: 꽃집 진열대 */
.supplybar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.supplybar .sb-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-right: 4px; }
.supchip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 5px 6px 5px 10px; text-align: left; }
.supchip:hover:not(:disabled) { border-color: var(--accent); }
.supchip .si { font-size: 18px; }
.supchip .sn { display: grid; line-height: 1.2; font-size: 12.5px; }
.supchip .sn small { font-size: 11px; color: var(--muted); }
.supchip .sp { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.bc-hero { display: grid; justify-items: center; gap: 6px; padding: 14px; border-radius: 14px; border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--pc) 10%, var(--panel)); }
.bc-parts { display: flex; align-items: center; gap: 8px; }
.bc-part { display: grid; justify-items: center; gap: 2px; padding: 6px 8px; border-radius: 12px; background: var(--panel); font-size: 11px; }
.bc-plus, .bc-arrow { color: var(--muted); }
.bc-out { display: flex; align-items: center; gap: 10px; }
.bc-out > div { display: grid; }
.bc-out b { font-family: var(--font-display); font-size: 18px; }
.sell-list { max-height: min(38vh, 300px); overflow-y: auto; padding-right: 2px; }
.sell-item { padding: 3px 10px 3px 4px; grid-template-columns: 42px minmax(0, 1fr) auto; }
.sell-item .rc-art { width: 42px; height: 42px; }
.sell-item .rc-main b { font-size: 13.5px; }
.sell-item.off { opacity: .5; }
.sell-r { display: grid; justify-items: end; gap: 3px; }
.sell-r .data { font-weight: 600; font-size: 13px; }
/* 값에 좋은 것은 진한 초록, 나쁜 것은 연한 빨강 (10-06) */
:root { --val-up: #2e7d3c; --val-down: #e07a72; }
.val-up { color: var(--val-up); font-weight: 700; }
.val-down { color: var(--val-down); font-weight: 700; }
.hat-chip { color: var(--val-up); background: color-mix(in srgb, var(--val-up) 12%, var(--panel)); font-size: 10.5px; padding: 0 6px; border-radius: 999px; }
.raw-chip { color: var(--val-down); background: color-mix(in srgb, var(--val-down) 14%, var(--panel)); font-size: 10.5px; padding: 0 6px; border-radius: 999px; }
.teacard .cc-meta .chip { margin-left: 2px; }
.teacard.hat { border-color: color-mix(in srgb, #7bb05a 55%, var(--line)); }
.teacard.raw { border-style: dashed; border-color: color-mix(in srgb, #d98a5a 55%, var(--line)); }
.cc-acts:has(> :nth-child(3)) { flex-wrap: wrap; }
.cc-acts:has(> :nth-child(3)) .btn { flex: 1 1 40%; }
.cc-acts:has(> :nth-child(3)) .btn:first-child { flex-basis: 100%; }
.cold-chip { color: var(--val-down); background: color-mix(in srgb, var(--val-down) 14%, var(--panel)); font-size: 10.5px; padding: 0 6px; border-radius: 999px; }
/* ☕ 카운터: 나무빛 상자 */
/* 제다실 흐름 칩: 생화 › 꽃방 › 말린 꽃잎 › 블렌드 › 찻집으로 */
.flow-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.fs-step { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; }
.fs-step b { font-size: 11.5px; color: var(--accent); }
.fs-step.zero { opacity: .5; }
.fs-step.zero b { color: var(--muted); }
.fs-step:hover { border-color: var(--accent); }
.fs-step.out { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); font-weight: 600; }
.fs-arrow { color: var(--muted); font-weight: 700; }
#p-tearoom .cab-head { scroll-margin-top: 70px; }
/* 블렌드 카드: 말린 꽃잎을 부채꼴로 겹쳐 놓기 */
.blend-art { display: inline-flex; align-items: flex-end; justify-content: center; }
.blend-art img { margin: 0 -7px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.15)); }
.blend-art.n2 img:nth-child(1) { transform: rotate(-14deg) translateY(2px); }
.blend-art.n2 img:nth-child(2) { transform: rotate(14deg) translateY(2px); }
.blend-art.n3 img:nth-child(1) { transform: rotate(-22deg) translateY(6px); }
.blend-art.n3 img:nth-child(2) { transform: translateY(-4px); z-index: 1; }
.blend-art.n3 img:nth-child(3) { transform: rotate(22deg) translateY(6px); }
/* 찻집 간판: OPEN / CLOSED 나무 팻말 */
.shop-sign { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px; background: var(--sunk); }
.ss-board { flex: none; display: grid; justify-items: center; line-height: 1.05; padding: 6px 12px 5px; border-radius: 10px; color: #fff8ec; background: linear-gradient(180deg, #9b6a3e, #7d5330); box-shadow: 0 2px 0 #5e3d22, inset 0 1px 0 rgba(255,255,255,.18); transform: rotate(-2deg); }
.ss-board b { font-family: var(--font-data); font-size: 15px; letter-spacing: .08em; }
.ss-board small { font-size: 10px; opacity: .85; }
.shop-sign.open .ss-board b { color: #ffe9a8; }
.shop-sign.closed .ss-board { background: linear-gradient(180deg, #8a8378, #6d675e); box-shadow: 0 2px 0 #4e4a44, inset 0 1px 0 rgba(255,255,255,.15); transform: rotate(2deg); }
.ss-txt { display: grid; min-width: 0; line-height: 1.3; }
.ss-txt b { font-size: 13.5px; }
.ss-txt small { font-size: 11.5px; color: var(--muted); }
.counter.closed { background: var(--sunk); border-style: dashed; box-shadow: none; }
.counter { display: grid; gap: 8px; padding: 10px 12px 12px; border-radius: 16px; background: linear-gradient(180deg, color-mix(in srgb, #c89a6a 16%, var(--panel)), color-mix(in srgb, #b07a4a 10%, var(--panel))); border: 1px solid color-mix(in srgb, #b07a4a 35%, var(--line)); box-shadow: inset 0 -4px 0 color-mix(in srgb, #9b6a3e 22%, transparent); }
.counter .cab-head { margin-top: 0; }
.cust-bar { height: 5px; border-radius: 999px; background: color-mix(in srgb, #9b6a3e 18%, var(--panel)); overflow: hidden; }
.cust-bar i { display: block; height: 100%; background: linear-gradient(90deg, #c89a6a, #9b6a3e); border-radius: 999px; transition: width .6s; }
.sc-next-up { position: absolute; top: 6px; right: 6px; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #fff8ec; background: #9b6a3e; }
.counter.empty { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.counter.empty > span { font-size: 22px; }
.cupcard:not(.cold) .cup-steam img { animation: cupFloat 2.6s ease-in-out infinite; }
@keyframes cupFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .cupcard .cup-steam img { animation: none; } }
.cupcard { border-color: color-mix(in srgb, #c98a4a 45%, var(--line)); }
.cupcard.cold { border-color: color-mix(in srgb, #7aa7cf 50%, var(--line)); opacity: .92; }
.blend-chip { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.rc-total .rc-sum .good { color: var(--good); }
.rc-notes { display: grid; gap: 6px; font-size: 12.5px; }
.rc-notes span { padding: 6px 10px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.rc-notes .rc-warn { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); color: var(--warn); font-weight: 600; }

/* ── 화원, 창고, 찻집 공통 목록 */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.fcard.off { opacity: .72; }
.fcard .top { display: flex; align-items: center; gap: 8px; }
.fcard .top b { font-size: 15px; }
.fcard .top .price { margin-left: auto; font-family: var(--font-data); }
.strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; }
.strip i { height: 10px; border-radius: 2px; background: var(--sunk); position: relative; }
.strip i.sow { box-shadow: inset 0 -4px 0 var(--seed); }
.strip i.bloom { background: var(--c); }
.strip i.rest { background: repeating-linear-gradient(45deg, var(--sunk) 0 3px, transparent 3px 6px); }
.strip i.now::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink); }
.months { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; font-family: var(--font-data); font-size: 9px; color: var(--muted); text-align: center; }
/* 한 해 진행 막대 (3월 → 꽃샘달): 지도 위 가장자리에 붙은 얇은 띠, 지금 계절은 더 진하게 */
.mapwrap { position: relative; }
.yearstrip { display: grid; grid-template-columns: repeat(14, 1fr); height: 7px; background: var(--sunk); }
.yearstrip i { position: relative; overflow: hidden; }
.yearstrip i.now::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--p); width: 2px; margin-left: -1px; background: rgba(255,255,255,.5); }   /* 지금 위치 */
.yearstrip i b { position: absolute; inset: 0 auto 0 0; background: var(--c); opacity: .55; }
.yearstrip i.now { background: color-mix(in srgb, var(--c) 18%, transparent); }
.yearstrip i.cur b { opacity: .95; }                                   /* 지금 계절은 조금 더 진하게 */
.yearstrip i.cur { background: color-mix(in srgb, var(--c) 30%, transparent); }
.yearbar { display: grid; gap: 6px; }
.yb-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.yb-btns { display: flex; gap: 6px; }
.yb-info { font-size: 13px; margin-left: auto; text-align: right; }
.yb-track { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.yb-track i { height: 12px; border-radius: 3px; background: var(--sunk); overflow: hidden; position: relative; }
.yb-track i b { position: absolute; inset: 0 auto 0 0; background: var(--c); }
.yb-track i.now { box-shadow: 0 0 0 2px var(--ink); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--panel); width: 28px; height: 28px; }
.stepper span { min-width: 24px; text-align: center; font-family: var(--font-data); }
.list { display: grid; gap: 0; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lrow .name { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.lrow .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; }
.lrow.hl { background: linear-gradient(90deg, color-mix(in srgb, var(--good) 10%, transparent), transparent 70%); }
.sectionhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.sectionhead .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

/* ── 도감 (도감일지 · 기록 · 도감) */
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.dexcell { display: flex; align-items: center; gap: 7px; padding: 8px; border-radius: 8px; background: var(--sunk); border: 0; text-align: left; font-size: 13px; min-width: 0; }
.dexcell span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dexcell.locked { color: var(--muted); cursor: default; }
.dexcell.locked .dot, .dexcell.locked .sw { background: var(--line) !important; box-shadow: none; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }
/* 도트아트 */
img.px { image-rendering: pixelated; image-rendering: crisp-edges; flex: none; display: block; }
.dexgrid.big { grid-template-columns: repeat(auto-fill, minmax(max(96px, calc((100% - 40px) / 6)), 1fr)); gap: 8px; } /* 한 줄 최대 6칸 → 11칸이 6+5로 나뉨 */
.dexcell.big { flex-direction: column; justify-content: center; text-align: center; gap: 6px; padding: 10px 6px 8px; }
.dexcell.big:not(.locked):hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.dexcell.big .t { white-space: normal; line-height: 1.3; }
.dexcell.big .stars { font-size: 11px; }
/* 도감 카드 */
.dexcard { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 7px 7px 9px; display: grid; gap: 5px; justify-items: center; text-align: center; font-size: 13px; color: var(--ink); min-width: 0; }
.dexcard:not(.locked):hover { border-color: var(--accent); }
.dexcard .dc-art { width: 100%; height: 76px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--pc) 16%, var(--sunk)); }
.dexcard .dc-name { font-weight: 600; line-height: 1.25; }
.dexcard .stars { font-size: 11px; }
.dexcard .dc-sub { font-size: 11px; color: var(--muted); line-height: 1.3; min-height: 1.3em; }
.dexcard.locked .dc-sub { color: color-mix(in srgb, var(--muted) 80%, transparent); font-style: italic; }
.dexcard:not(.locked) { box-shadow: 0 1px 0 color-mix(in srgb, var(--pc) 35%, transparent); }
/* 도감 종류 칩: 이름 · 모은 수 · 아래 얇은 막대 */
.dexchips { display: flex; flex-wrap: wrap; gap: 6px; }
.dexchip { position: relative; overflow: hidden; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 13px; }
.dexchip .data { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.dexchip i { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, transparent) var(--p), transparent var(--p)); }
.dexchip:hover { border-color: var(--accent); }
.dexchip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); font-weight: 700; }
.dexchip[aria-pressed="true"] .data { color: var(--accent); }
.dexchip.done::after { content: "✓"; color: var(--accent); font-weight: 700; font-size: 12px; }
@media (max-width: 480px) { .dexchips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); } .dexchip { justify-content: center; flex-wrap: wrap; gap: 0 4px; padding-inline: 6px; } }
.dry-tabs .dexchip { align-items: center; padding: 5px 10px 6px; }
.dry-tabs .dexchip img { margin-right: -2px; }
.dex-head { align-items: center; margin-top: 10px; }
.dex-head .dh-count { font-weight: 600; font-size: 13px; }
.dh-bar { width: 80px; height: 5px; border-radius: 999px; background: var(--sunk); overflow: hidden; display: block; }
.dh-bar i { display: block; height: 100%; background: var(--accent); }
.dex-head .muted { font-size: 12px; }
.dex-total { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.dexcard .dc-sub:empty { display: none; }
.rec-line { font-size: 13px; }
.rec-line .stars { font-size: 12px; }
.dexcard.locked { cursor: default; }
/* 블렌드: 차 줄 안에서 테두리를 다르게 (점선 + 찻잎 표시) */

.dexcard.blend.locked { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.dex-blends { margin-top: 8px; }
.dexcard.locked .dc-art { background: var(--sunk); }
.dexcard.locked .dc-name { color: var(--muted); font-weight: 400; }
.dc-land { width: 48px; height: 48px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); background-image: linear-gradient(45deg, rgba(255,255,255,.1) 25%, transparent 25% 50%, rgba(255,255,255,.1) 50% 75%, transparent 75%); background-size: 12px 12px; }
.dex-stats { grid-template-columns: repeat(4, 1fr); }
.sx-stats b small { font-size: 12px; color: var(--muted); font-weight: 400; }
.dex-bar { width: 80%; height: 5px; border-radius: 999px; background: var(--sunk); overflow: hidden; margin-top: 3px; }
.dex-bar i { display: block; height: 100%; background: var(--accent); }
@media (max-width: 480px) { .dex-stats { grid-template-columns: repeat(2, 1fr); } .dex-stats > div:nth-child(3) { border-left: 0; } .dex-stats > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
.rec-art { position: relative; }
.rec-noimg { aspect-ratio: 4 / 3; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--sunk); display: grid; place-content: center; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); text-align: center; padding: 10px; }
.rec-noimg span { font-size: 26px; opacity: .6; }
.rec-head { display: flex; align-items: baseline; gap: 8px; }
.rec-head h3 { font-family: var(--font-display); font-size: 18px; margin: 0; }
.rec-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rec-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 8px; border-radius: 12px; background: var(--sunk); }
.rec-chip > span:last-child { display: grid; line-height: 1.2; }
.rec-chip small { font-size: 10.5px; color: var(--muted); }
.rec-chip b { font-size: 13px; }
.rec-chip .rec-ic { font-size: 18px; }
.rec-log summary { cursor: pointer; font-size: 13px; }
.rec-art img { image-rendering: pixelated; }
.rec-lands { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.rec-lands .sw { width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
.dex-chain { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; }
.dc-step { display: grid; justify-items: center; gap: 1px; padding: 5px 8px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 11px; color: var(--muted); }
.dc-step.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--ink); font-weight: 600; }
.dc-step:not(.on):not(.locked):hover { border-color: var(--accent); }
.dc-step.locked { opacity: .55; cursor: default; }
.dc-arrow { color: var(--muted); font-weight: 700; }
.dexart { display: grid; place-items: center; background: var(--sunk); border-radius: 10px; padding: 12px; }
.progress { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.tally { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sunk); }
.tally i { display: block; height: 100%; }
.record { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 560px) { .record { grid-template-columns: minmax(0, 1fr); } }
.record img { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }

/* ── 창과 알림 */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15,20,16,.45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); color: var(--ink); border-radius: 12px; border: 1px solid var(--line); width: min(560px, 100%); max-height: min(86vh, 760px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; box-shadow: 0 20px 50px rgba(0,0,0,.25); }

.gardenlog .gl-t small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.gl-foot { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); text-align: center; }
.toast { position: fixed; left: 50%; transform: translate(-50%, 8px); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: rgba(28,36,30,.94); color: #f2f5ef; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; border: 0; max-width: calc(100% - 32px); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }

@media (prefers-reduced-motion: reduce) { :root.season-anim body { transition: none; } .toast { transition: none; transform: translate(-50%, 0); } }
/* 설정 카드 */

.setcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.setcard .sc-h { display: flex; gap: 10px; align-items: flex-start; }
