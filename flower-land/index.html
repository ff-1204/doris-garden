eight="1" fill="#6db35a"/><rect x="4" y="4" width="1" height="1" fill="#6db35a"/><rect x="5" y="4" width="1" height="1" fill="#4f8f3e"/><rect x="6" y="4" width="1" height="1" fill="#6db35a"/><rect x="7" y="4" width="1" height="1" fill="#6db35a"/><rect x="8" y="4" width="1" height="1" fill="#6db35a"/><rect x="5" y="5" width="1" height="1" fill="#4f8f3e"/><rect x="5" y="6" width="1" height="1" fill="#4f8f3e"/><rect x="2" y="7" width="1" height="1" fill="#a5743f"/><rect x="3" y="7" width="1" height="1" fill="#a5743f"/><rect x="4" y="7" width="1" height="1" fill="#a5743f"/><rect x="5" y="7" width="1" height="1" fill="#a5743f"/><rect x="6" y="7" width="1" height="1" fill="#a5743f"/><rect x="7" y="7" width="1" height="1" fill="#a5743f"/><rect x="8" y="7" width="1" height="1" fill="#a5743f"/><rect x="1" y="8" width="1" height="1" fill="#a5743f"/><rect x="2" y="8" width="1" height="1" fill="#a5743f"/><rect x="3" y="8" width="1" height="1" fill="#a5743f"/><rect x="4" y="8" width="1" height="1" fill="#a5743f"/><rect x="5" y="8" width="1" height="1" fill="#a5743f"/><rect x="6" y="8" width="1" height="1" fill="#a5743f"/><rect x="7" y="8" width="1" height="1" fill="#a5743f"/><rect x="8" y="8" width="1" height="1" fill="#a5743f"/><rect x="9" y="8" width="1" height="1" fill="#a5743f"/><rect x="2" y="9" width="1" height="1" fill="#7a5230"/><rect x="3" y="9" width="1" height="1" fill="#7a5230"/><rect x="4" y="9" width="1" height="1" fill="#7a5230"/><rect x="5" y="9" width="1" height="1" fill="#7a5230"/><rect x="6" y="9" width="1" height="1" fill="#7a5230"/><rect x="7" y="9" width="1" height="1" fill="#7a5230"/><rect x="8" y="9" width="1" height="1" fill="#7a5230"/></svg><span class="logo-ttl" id="brandTitle" hidden></span><span class="bt"><b>도리의 정원</b><small>Dori's Garden</small></span></button>

  </header>

  <div class="body">
    <main>
      <div class="feedback topfb" id="feedbackTop" role="status" hidden></div>
      <!-- 🌱 정원 -->
      <section class="panel on" id="p-garden" aria-label="정원">
        <div class="garden">
          <div class="stack" style="min-width:0">
            <div id="guideBox" class="today"></div>
            <div class="tray" id="tray" hidden></div>
            <div class="hintbar">
              <span class="msg" id="hint"></span>
              <span class="needs" id="needs" aria-label="돌봄이 필요한 꽃"></span>
            </div>
            <div class="mapwrap">
              <div class="mapframe">
                <div class="yearstrip" id="yearBox" role="img" aria-label="올해의 흐름"></div>
                <canvas id="map" aria-label="정원 지도"></canvas>
                <div class="ysky" id="yearSky" aria-hidden="true" hidden></div>
                <div class="emptyhint" id="emptyMap" hidden></div>
                <div class="snack" id="snack" role="status" hidden></div>
                <div class="legend2 on-map" id="legend2"></div>
                <div class="care-ring" id="careRing" hidden></div>
                <div class="v-bubble" id="visitorBubble" role="status" hidden></div>
              </div>
              <div class="emptyhint" id="restBanner" hidden><div class="box"><button type="button" class="iconbtn restclose" data-rest="close" aria-label="닫기">✕</button><b>🌙 꽃잠이에요</b><span class="muted rest-long" style="font-size: calc(13 * var(--u))">꽃들이 자고 있어요. 옮겨심기 · 번식 · 돌보기, 핀 채로 잠든 꽃 수확은 할 수 있어요. 블렌딩이나 새해 꽃 예약도 해 보세요.</span><span class="muted rest-short">옮겨심기 · 번식 · 돌보기 · 수확은 돼요</span></div></div>
            </div>
          </div>
          <div class="sidecol">
            <aside class="status idle" id="status" aria-label="꽃 상태창"></aside>
            <div id="today" class="today"></div>
          </div>
        </div>
      </section>

      <!-- 💐 화원 -->
      <section class="panel" id="p-shop" aria-label="화원"></section>
      <!-- 📦 창고 -->
      <section class="panel" id="p-store" aria-label="창고"></section>
      <!-- 🌿 제다실 (꽃잎 · 꽃방 · 블렌딩) -->
      <section class="panel" id="p-tearoom" aria-label="제다실"></section>
      <!-- 🍵 찻집 -->
      <section class="panel" id="p-cab" aria-label="찻집"></section>
      <!-- 📖 도감 (도감일지 · 기록 · 도감) -->
      <section class="panel" id="p-mine" aria-label="광산"></section>
      <section class="panel" id="p-forest" aria-label="작은 숲"></section>
      <section class="panel" id="p-farm" aria-label="곤충농장"></section>
      <section class="panel" id="p-dex" aria-label="도감과 기록"></section>
      <section class="panel" id="p-manual" aria-label="매뉴얼"></section>
      <section class="panel" id="p-settings" aria-label="설정">
        <div class="stack">
          <details class="card gardenlog" id="gardenLog"><summary><span class="gl-ic">📜</span><span class="gl-t"><b>정원 일지</b><small id="logLatest">올해 정원에서 생긴 일 · 쉼달에 한 해 기록으로 옮겨져요</small></span><span class="gl-n" id="logCount"></span><span class="gl-chev" aria-hidden="true">▾</span></summary><div class="logfilter" id="logFilter"></div><div class="logview" id="logView"></div><p class="gl-foot">쉼달이 시작되면 올해 일지는 도감·기록의 "기록"으로 옮겨져요</p></details>
          <div id="settingsBody"></div>
        </div>
      </section>
    </main>

    <nav class="tabs" role="tablist" aria-label="화면">
      <button type="button" role="tab" data-tab="garden" aria-selected="true"><span class="ic">🌱</span>정원</button>
      <button type="button" role="tab" data-tab="shop" aria-selected="false"><span class="ic">💐</span>화원</button>
      <button type="button" role="tab" data-tab="tearoom" aria-selected="false"><span class="ic">🌿</span>제다실</button>
      <button type="button" role="tab" data-tab="cab" aria-selected="false"><span class="ic">🍵<i class="tab-dot" id="inboxDot" hidden></i></span>찻집</button>
      <button type="button" role="tab" data-tab="store" aria-selected="false"><span class="ic">📦</span>창고</button>
      <button type="button" role="tab" data-tab="mine" aria-selected="false"><span class="ic">⛏️</span>광산</button>
      <button type="button" role="tab" data-tab="farm" aria-selected="false"><span class="ic">🐝</span>곤충농장</button>
      <button type="button" role="tab" data-tab="forest" aria-selected="false" hidden><span class="ic">🌳</span>숲</button>
      <button type="button" role="tab" data-tab="dex" aria-selected="false"><span class="ic">📖</span>도감</button>
      <button type="button" role="tab" data-tab="manual" aria-selected="false"><span class="ic">📘</span>매뉴얼</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false"><span class="ic">⚙️<i class="tab-dot" id="saveDot" hidden></i></span>설정</button>
    </nav>
  </div>
</div>
