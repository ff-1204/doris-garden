# GitHub Pages 배포: main에 올리면 테스트 → 배포본(_site) 모으기 → Pages에 올림
# 주소: https://ff-1204.github.io/doris-garden/ (저장소 Settings › Pages › Source를 "GitHub Actions"로 켜야 동작)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 엔진 테스트
        run: node flower-land/tests/run.js
      - name: 배포본 모으기
        run: node flower-land/tools/build-site.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
